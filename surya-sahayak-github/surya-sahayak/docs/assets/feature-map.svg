<text x="420" y="402" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FCFBF8">Replay 5 years of weather</text>
<text x="420" y="424" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#FCFBF8" fill-opacity=".75">Open-Meteo ERA5, hourly,</text>
<text x="420" y="443" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#FCFBF8" fill-opacity=".75">anchored to PVGIS</text>
