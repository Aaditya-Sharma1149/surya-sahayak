<text x="64" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#172B3A">Electricity bill</text>
<text x="64" y="348" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5E6D79">Photo or PDF, up to 10 MB</text>
