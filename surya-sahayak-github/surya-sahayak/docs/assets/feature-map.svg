<text x="420" y="226" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FCFBF8">Read the bill</text>
<text x="420" y="248" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#FCFBF8" fill-opacity=".75">Amazon Bedrock Nova Lite</text>
<text x="420" y="267" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#FCFBF8" fill-opacity=".75">units, load, discom, PIN</text>
