<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="t d">
<title id="t">Surya Sahayak feature map</title>
<desc id="d">One electricity bill goes in; Surya Sahayak reads it, finds the roof, replays five years of weather and does the maths; ten features come out.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C9962B"/></marker>
<radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F4B942" stop-opacity=".45"/><stop offset="1" stop-color="#F4B942" stop-opacity="0"/></radialGradient></defs>
<rect width="1280" height="760" rx="20" fill="#FCFBF8"/>
<text x="40" y="58" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#172B3A">One upload in, a full rooftop-solar plan out</text>
<text x="40" y="88" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#5E6D79">Everything on the right comes from a single electricity bill. Nothing to fill in unless the bill is unreadable.</text>
<rect x="40" y="140" width="250" height="300" rx="16" fill="#fff" stroke="#E4E8EB" stroke-width="1.5"/>
<text x="64" y="176" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#8A5A00">You give</text>
